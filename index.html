<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Registro de Caídas de Elementos de Corte (GET)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #0056b3; --secondary: #f4f7f6; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--secondary); color: var(--text); margin: 0; padding: 0; }
        header { background-color: var(--primary); color: white; padding: 15px 20px; text-align: center; }
        .nav-tabs { display: flex; justify-content: center; background-color: #ddd; padding: 10px; }
        .nav-tabs button { background-color: white; border: none; padding: 10px 20px; margin: 0 5px; cursor: pointer; font-weight: bold; border-radius: 5px; transition: 0.3s; }
        .nav-tabs button.active, .nav-tabs button:hover { background-color: var(--primary); color: white; }
        .container { max-width: 1000px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 0.9em;}
        input, select, textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button.submit-btn { grid-column: 1 / -1; background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 1.1em; cursor: pointer; margin-top: 10px; }
        button.submit-btn:hover { background-color: #218838; }
        button.submit-btn:disabled { background-color: #6c757d; cursor: not-allowed; }
        .chart-container { width: 100%; max-width: 600px; margin: 0 auto 30px auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: var(--primary); color: white; }
        .loading { text-align: center; font-style: italic; color: #666; margin: 20px 0; }
    </style>
</head>
<body>

    <header>
        <h2>Gestión de Elementos de Corte (GET)</h2>
    </header>

    <div class="nav-tabs">
        <button class="active" onclick="showTab('formTab', this)">Nuevo Registro</button>
        <button onclick="showTab('dashTab', this)">Dashboard</button>
    </div>

    <div class="container">
        <!-- PESTAÑA: FORMULARIO -->
        <div id="formTab" class="tab-content active">
            <h3>Registrar Nueva Caída</h3>
            <form id="registroForm" name="registroForm">
                <div class="form-grid">
                    <div class="form-group"><label>ID / Orden:</label><input type="text" name="ID" required></div>
                    <div class="form-group"><label>Fecha:</label><input type="date" name="FECHA" required></div>
                    <div class="form-group"><label>Equipo (Ej. 6014):</label><input type="text" name="EQUIPO" required></div>
                    <div class="form-group"><label>N/C (Componente):</label><input type="text" name="NC"></div>
                    <div class="form-group"><label>Posición:</label><input type="text" name="POSICION"></div>
                    <div class="form-group"><label>Horas:</label><input type="number" name="HORAS"></div>
                    <div class="form-group"><label>Referencia:</label><input type="text" name="REFERENCIA"></div>
                    <div class="form-group"><label>Contexto Operacional:</label><input type="text" name="CONTEXTO_OPERACIONAL"></div>
                    <div class="form-group"><label>Tajo / Ubicación:</label><input type="text" name="TAJO"></div>
                    <div class="form-group"><label>Horas Cucharón:</label><input type="number" name="HORAS_CUCHARON"></div>
                    <div class="form-group">
                        <label>Estado:</label>
                        <select name="ESTADO">
                            <option value="ACTIVO">ACTIVO</option>
                            <option value="INACTIVO">INACTIVO</option>
                            <option value="EN REPARACIÓN">EN REPARACIÓN</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Foto (URL):</label><input type="text" name="FOTO"></div>
                    <div class="form-group" style="grid-column: 1 / -1;"><label>Comentarios:</label><textarea name="COMENTARIOS" rows="3"></textarea></div>
                    
                    <input type="hidden" name="MES" id="hiddenMes">
                    <input type="hidden" name="ANO" id="hiddenAno">
                    <button type="submit" class="submit-btn" id="submitBtn">Guardar Registro</button>
                </div>
            </form>
        </div>

        <!-- PESTAÑA: DASHBOARD -->
        <div id="dashTab" class="tab-content">
            <h3>Reporte de Caídas</h3>
            <p><i>El dashboard se sincroniza en tiempo real con Google Sheets.</i></p>
            
            <div id="loadingMsg" class="loading">Cargando datos desde Google Sheets...</div>
            
            <div class="chart-container">
                <canvas id="graficoEquipos"></canvas>
            </div>
            
            <div style="overflow-x:auto;">
                <table id="tablaRegistros">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Equipo</th>
                            <th>Posición</th>
                            <th>Tajo</th>
                            <th>Estado</th>
                            <th>Mes/Año</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Datos insertados por JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyrFFPlVY0QJCGI_SZAgi5hjOnXSdT1Edokuqs_KILe4utmz0pg2yC-jOZ7tiI7Xyjd/exec';
        
        let registros = [];
        let miGrafico = null;
        let datosCargados = false; // Bandera para no cargar múltiples veces

        function showTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
            
            // Cargar datos reales al abrir la pestaña del Dashboard si no se han cargado
            if(tabId === 'dashTab' && !datosCargados) {
                cargarDatosDeGoogle();
            }
        }

        // FUNCIÓN PARA LEER DATOS DESDE GOOGLE SHEETS
        function cargarDatosDeGoogle() {
            document.getElementById('loadingMsg').style.display = 'block';
            
            fetch(scriptURL)
                .then(response => response.json())
                .then(data => {
                    // Mapear los datos de las columnas de Excel a nuestro array
                    registros = data.map(row => ({
                        fecha: row.FECHA, 
                        equipo: row.EQUIPO,
                        posicion: row.POSICION,
                        tajo: row.TAJO,
                        estado: row.ESTADO,
                        mes: row.Mes || row.MES || ""
                    })).filter(row => row.equipo !== ""); // Filtramos filas vacías
                    
                    datosCargados = true;
                    document.getElementById('loadingMsg').style.display = 'none';
                    actualizarDashboard();
                })
                .catch(error => {
                    console.error('Error al cargar datos:', error);
                    document.getElementById('loadingMsg').innerText = "Error al conectar con la base de datos.";
                    document.getElementById('loadingMsg').style.color = "red";
                });
        }

        const form = document.forms['registroForm'];
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            const fechaVal = form['FECHA'].value;
            const splitFecha = fechaVal.split('-'); 
            document.getElementById('hiddenMes').value = splitFecha[0] + "/" + splitFecha[1];
            document.getElementById('hiddenAno').value = splitFecha[0];

            submitBtn.textContent = 'Guardando datos...';
            submitBtn.disabled = true;

            fetch(scriptURL, { method: 'POST', body: new FormData(form), mode: 'no-cors' })
                .then(response => {
                    alert("¡Registro guardado con éxito en la Base de Datos!");
                    // Reseteamos bandera para que al abrir dashboard recargue datos actualizados
                    datosCargados = false; 
                    form.reset();
                    submitBtn.textContent = 'Guardar Registro';
                    submitBtn.disabled = false;
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert("Hubo un error de red, intenta nuevamente.");
                    submitBtn.textContent = 'Guardar Registro';
                    submitBtn.disabled = false;
                });
        });

        function actualizarDashboard() {
            const tbody = document.querySelector("#tablaRegistros tbody");
            tbody.innerHTML = "";
            let conteoEquipos = {};

            registros.forEach(reg => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${reg.fecha}</td><td>${reg.equipo}</td><td>${reg.posicion}</td><td>${reg.tajo}</td><td>${reg.estado}</td><td>${reg.mes}</td>`;
                tbody.appendChild(tr);
                conteoEquipos[reg.equipo] = (conteoEquipos[reg.equipo] || 0) + 1;
            });

            const ctx = document.getElementById('graficoEquipos').getContext('2d');
            if(miGrafico) { miGrafico.destroy(); } 

            miGrafico = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(conteoEquipos),
                    datasets: [{ label: 'Número de Caídas por Equipo', data: Object.values(conteoEquipos), backgroundColor: '#0056b3' }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });
        }
    </script>
</body>
</html>
